# docker compose up --build runs the app and a one-shot ingest against the
# database named by DATABASE_URL in .env (e.g. Supabase). Both binaries apply
# migrations at startup.
#
# For a fully local database instead of Supabase, start the bundled pgvector
# service with its profile and point DATABASE_URL at it:
#   docker compose --profile local up --build db
#   DATABASE_URL=postgres://app:app@db:5432/theory?sslmode=disable (on app/ingest)

services:
  # Local pgvector Postgres. Not started by default — enable with --profile local
  # when you want to run against a local DB instead of Supabase.
  db:
    profiles: ["local"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: theory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d theory"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    env_file: .env
    environment:
      # DATABASE_URL comes from .env (Supabase). HTTP_ADDR is fixed for the container.
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"

  # One-shot: chunk + embed the corpus into pgvector, then exit.
  ingest:
    build:
      context: .
    entrypoint: ["/app/ingest"]
    env_file: .env
    restart: "no"

volumes:
  pgdata:
