# docker compose up --build runs the whole demo: Postgres (pgvector), the app,
# and a one-shot ingest that populates the corpus after the database is healthy.
# The app applies migrations at startup, so it waits only on the db healthcheck.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: theory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d theory"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    env_file: .env
    environment:
      # Override the DSN to reach the db service on the compose network.
      DATABASE_URL: postgres://app:app@db:5432/theory?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # One-shot: chunk + embed the corpus into pgvector, then exit.
  ingest:
    build:
      context: .
    entrypoint: ["/app/ingest"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/theory?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
